[package]
name = "vault-search"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = "0.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
walkdir = "2.5"
yaml-rust2 = "0.11"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
strip = true
